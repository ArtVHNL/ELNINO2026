# El Niño 2026 — Deploy dashboard to GitHub Pages
# Triggered by every push to main AND by a completed data-update run,
# so the live site always reflects the latest committed data.
name: Deploy Dashboard

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update ENSO Data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Bundle live data + news into the static site
        run: |
          cp data.json app/dist/data.json
          cp meta.json app/dist/meta.json
          if [ -d news ]; then cp -r news app/dist/news; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
