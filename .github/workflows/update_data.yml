# El Niño 2026 — Data Pipeline (automated)
# Runs twice daily, fetches all verified NOAA/PSL/CPC endpoints, validates,
# generates the DeepSeek briefing + news digest, and commits the results.
name: Update ENSO Data

on:
  schedule:
    - cron: '0 6 * * *'    # 06:00 UTC
    - cron: '0 18 * * *'   # 18:00 UTC
  workflow_dispatch:       # manual trigger for debugging

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy netCDF4 pytest

      - name: Run data pipeline
        id: pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: |
          python scripts/fetch_data.py --out . 2>&1 | tee pipeline_output.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Run pipeline tests
        run: |
          python -m pytest scripts/test_pipeline.py -q --cache-clear || true

      - name: Generate DeepSeek briefing + news digest
        id: briefing
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            python scripts/deepseek_briefing.py --data data.json --out news --fetch-news
          else
            echo "DEEPSEEK_API_KEY not set — skipping AI briefing"
          fi

      - name: Ping healthchecks.io
        if: always()
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
          PIPELINE_EXIT: ${{ steps.pipeline.outputs.exit_code }}
        run: |
          if [ -n "$HEALTHCHECKS_URL" ]; then
            if [ "$PIPELINE_EXIT" = "0" ]; then
              curl -fsS -m 10 "$HEALTHCHECKS_URL" > /dev/null || true
            else
              curl -fsS -m 10 "$HEALTHCHECKS_URL/fail" > /dev/null || true
            fi
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json meta.json news/ history/ reference/
          # Only commit if data changed
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "Auto-update ENSO data: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Log pipeline outcome
        if: always()
        run: |
          echo "## Pipeline Run: $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "Exit code: ${{ steps.pipeline.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f meta.json ]; then
            python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
import json
try:
    m = json.load(open("meta.json"))
    s = m.get("summary", {})
    print(f"Endpoints: {s.get('endpoints_total')} total — {s.get('live')} live, "
          f"{s.get('derived')} derived, {s.get('synthetic')} synthetic, {s.get('error')} error")
    for name, st in m.get("health", {}).items():
        print(f"- {name}: {st.get('source')}" + (f" ({st.get('error', '')[:80]})" if st.get("error") else ""))
except Exception as e:
    print(f"meta.json unreadable: {e}")
EOF
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -30 pipeline_output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
