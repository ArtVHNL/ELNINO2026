# GitHub Actions — El Niño 2026 Data Pipeline
# Triggers daily, fetches all ENSO endpoints, builds data.json
name: Update ENSO Data

on:
  schedule:
    # Daily at 06:00 UTC — before US market open
    - cron: '0 6 * * *'
  workflow_dispatch:  # Manual trigger for debugging

permissions:
  contents: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (Pangeo stack)
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy pandas xarray netCDF4

      - name: Run data pipeline
        id: pipeline
        env:
          OUTPUT_DIR: ${{ github.workspace }}
        run: |
          python scripts/fetch_data.py 2>&1 | tee pipeline_output.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json pipeline.log
          # Only commit if data changed
          if git diff --cached --quiet; then
            echo "No changes to data.json — skipping commit"
          else
            git commit -m "Auto-update ENSO data: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Log pipeline outcome
        if: always()
        run: |
          echo "## Pipeline Run: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "Exit code: ${{ steps.pipeline.outputs.exit_code }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat pipeline_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
